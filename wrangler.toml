name = "kiddo-scoreboard"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# D1 database (local dev uses --local flag; production ID set via `wrangler d1 create`)
[[d1_databases]]
binding = "DB"
database_name = "kiddo-scoreboard-db"
database_id = "local-dev-placeholder"  # replaced at deploy time
migrations_dir = "migrations"

[dev]
port = 8787
