name: Deploy to Cloudflare Pages + Auto-Backup

on:
  push:
    branches: [main]
    # INCIDENTS.md 是失败记录, push 它不能又触发一次 action (否则循环)
    paths-ignore:
      - 'docs/INCIDENTS.md'
  workflow_dispatch:
    inputs:
      skip_backup:
        description: 'Skip pre-deploy backup (manual override only)'
        type: boolean
        default: false

# 防止并发 deploy 撞车
concurrency:
  group: pages-deploy
  cancel-in-progress: false

# 允许 GH bot commit + push (写 INCIDENTS.md 用)
permissions:
  contents: write

jobs:
  pre-deploy-backup:
    name: "🛡 Pre-deploy D1 backup"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: D1 Database Backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p remote-backup
          DATE=$(date -u +%Y-%m-%d)
          BACKUP_FILE="remote-backup/${DATE}.sql"
          echo "📦 Backing up D1 to ${BACKUP_FILE}..."
          wrangler d1 export kiddo-scoreboard-db --remote --output="${BACKUP_FILE}"
          echo "✅ Backup created: $(wc -c < ${BACKUP_FILE}) bytes"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.sha }}
          path: remote-backup/
          retention-days: 30

      - name: ❌ Record backup failure to docs/INCIDENTS.md
        if: failure()
        run: python3 .github/scripts/record_incident.py backup

  deploy:
    name: "🚀 Deploy to Cloudflare Pages"
    needs: pre-deploy-backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install project dependencies
        # wrangler needs node_modules to resolve imports like 'hono' in src/
        # Use npm install (not ci) so workspace 'prepare' scripts run and build packages/shared/dist/
        # Tip 29 fix: packages/shared/dist/ must exist for wrangler bundle to resolve 'mecha-challenge-shared'
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Apply D1 migrations to remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚣 Applying D1 migrations to remote..."
          wrangler d1 migrations apply kiddo-scoreboard-db --remote
          echo "✅ Migrations applied"

      - name: "🩹 Data migration: rewrite old running score_events (game_time → coins)"
        # Item #013 Stage 2: F1 commit df42182 changed running rewards to type='coins'
        # (was type='game_time' under the old #011 spec). Old running score_events
        # still have type='game_time' — they need to be rewritten to type='coins'
        # so the operation log displays them as "枚" (not "分钟") consistent with
        # the new spec. Idempotent: WHERE filter ensures no-op on re-run.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🩹 Rewriting old running score_events (type='game_time' → 'coins')..."
          wrangler d1 execute kiddo-scoreboard-db --remote --command \
            "UPDATE score_events SET type='coins' WHERE reason LIKE '跑步%' AND type='game_time';"
          echo "✅ Data migration complete (idempotent — no-op on re-run)"

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying to Cloudflare Pages..."
          wrangler pages deploy ./public \
            --branch main \
            --project-name kiddo-scoreboard \
            --commit-dirty=true
          echo "✅ Deploy complete"

      - name: Smoke test endpoints
        env:
          DEPLOY_URL: https://kiddo-scoreboard.pages.dev
          # /api/public/* endpoints require user_id (or child_id) query param.
          # PM user_id=1, child user_id=2 (set by init-prod SQL).
          PM_USER_ID: 1
          CHILD_USER_ID: 2
        run: |
          echo "🔍 Smoke testing endpoints..."
          for path in \
            "/" \
            "/health" \
            "/api/public/events?user_id=${PM_USER_ID}" \
            "/api/public/balance?user_id=${PM_USER_ID}" \
            "/api/public/tasks/progress?user_id=${CHILD_USER_ID}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}${path}")
            echo "  ${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "❌ Smoke test failed: ${path} returned ${code}"
              exit 1
            fi
          done
          echo "✅ All 5 endpoints returned 200"

      - name: ❌ Record deploy failure to docs/INCIDENTS.md
        if: failure()
        run: python3 .github/scripts/record_incident.py deploy
