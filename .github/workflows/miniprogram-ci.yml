name: Miniprogram CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Miniprogram shared tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      - name: Run shared package tests
        run: npm run test:shared

      - name: Typecheck (Phase 0 — tsconfig.phase0.json)
        run: npm run typecheck:phase0

      - name: Miniprogram stub
        run: npm run test:miniprogram
