<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素成就墙 — JAGER</title>
  <!-- Retro Pixel Fonts: Press Start 2P (EN) + VT323 (数字) + ZCOOL QingKe HuangYou (中文方块像素风) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #16181d;
      --card-bg: #23262e;
      --icon-box-bg: #181a20;
      --slate-border: #64748b;
      --slate-dark: #334155;
      --zh-font: 'ZCOOL QingKe HuangYou', 'Press Start 2P', sans-serif;
      --en-font: 'Press Start 2P', monospace;
      --num-font: 'VT323', monospace;
    }

    * { box-sizing: border-box; image-rendering: pixelated; image-rendering: crisp-edges; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #1c1917;
      /* Outer Terracotta & Mossy Pixel Brick Wall Pattern (模板同款) */
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.45)),
        url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='64' fill='%23292524'/%3E%3Crect x='2' y='2' width='28' height='12' fill='%236d4c3d'/%3E%3Crect x='2' y='2' width='28' height='2' fill='%238c6452'/%3E%3Crect x='34' y='2' width='28' height='12' fill='%235c3f32'/%3E%3Crect x='34' y='2' width='28' height='2' fill='%237a5545'/%3E%3Crect x='0' y='18' width='14' height='12' fill='%2357534e'/%3E%3Crect x='18' y='18' width='28' height='12' fill='%23785240'/%3E%3Crect x='18' y='18' width='28' height='2' fill='%23996b56'/%3E%3Crect x='50' y='18' width='14' height='12' fill='%23634537'/%3E%3Crect x='2' y='34' width='28' height='12' fill='%235c3f32'/%3E%3Crect x='34' y='34' width='28' height='12' fill='%236d4c3d'/%3E%3Crect x='34' y='34' width='28' height='2' fill='%238c6452'/%3E%3Crect x='0' y='50' width='14' height='12' fill='%234d594a'/%3E%3Crect x='18' y='50' width='28' height='12' fill='%2344403c'/%3E%3Crect x='50' y='50' width='14' height='12' fill='%23576354'/%3E%3C/svg%3E");
      background-size: 64px 64px;
      font-family: var(--en-font);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      overflow-x: hidden;
    }

    /* ====== 顶部控制行 (标题 + 星币 + SFX) ====== */
    .top-bar {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .top-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .top-title .title-icon { width: 34px; height: 34px; flex-shrink: 0; }
    .top-title h1 {
      margin: 0;
      font-family: var(--zh-font);
      font-size: 26px;
      letter-spacing: 2px;
      color: #fde047;
      text-shadow: 3px 3px 0 #0b0c0e;
      white-space: nowrap;
    }
    .top-title .title-sub {
      font-family: var(--en-font);
      font-size: 8px;
      color: #94a3b8;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #0b0c0e;
      margin-top: 4px;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .token-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--zh-font);
      font-size: 15px;
      color: #fef08a;
      padding: 6px 10px;
      background-color: #1c1f26;
      box-shadow:
        0 -3px 0 0 #0b0c0e, 0 3px 0 0 #0b0c0e, -3px 0 0 0 #0b0c0e, 3px 0 0 0 #0b0c0e,
        inset 0 3px 0 0 #ca8a04, inset 0 -3px 0 0 #713f12;
      text-shadow: 2px 2px 0 #0b0c0e;
    }
    .pixel-btn {
      background-color: #272a34;
      color: #f8fafc;
      font-family: var(--en-font);
      font-size: 9px;
      padding: 9px 12px;
      border: none;
      cursor: pointer;
      box-shadow:
        0 -3px 0 0 #0b0c0e, 0 3px 0 0 #0b0c0e, -3px 0 0 0 #0b0c0e, 3px 0 0 0 #0b0c0e,
        inset 0 3px 0 0 #475569, inset 0 -3px 0 0 #1e293b;
      transition: transform 0.08s steps(2);
    }
    .pixel-btn:hover {
      background-color: #333846;
      box-shadow:
        0 -3px 0 0 #0b0c0e, 0 3px 0 0 #0b0c0e, -3px 0 0 0 #0b0c0e, 3px 0 0 0 #0b0c0e,
        inset 0 3px 0 0 #facc15, inset 0 -3px 0 0 #a16207;
    }
    .pixel-btn:active { transform: translateY(2px); }

    /* ====== 地牢石砖板 (模板同款) ====== */
    .dungeon-board {
      width: 100%;
      max-width: 1120px;
      background-color: #21242b;
      background-image: url("data:image/svg+xml,%3Csvg width='64' height='32' viewBox='0 0 64 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='32' fill='%2316181d'/%3E%3Crect x='1' y='1' width='30' height='14' fill='%23252830'/%3E%3Crect x='1' y='1' width='30' height='2' fill='%2330343f'/%3E%3Crect x='33' y='1' width='30' height='14' fill='%2321242c'/%3E%3Crect x='33' y='1' width='30' height='2' fill='%232c303a'/%3E%3Crect x='0' y='17' width='14' height='14' fill='%2321242c'/%3E%3Crect x='16' y='17' width='30' height='14' fill='%23272b34'/%3E%3Crect x='16' y='17' width='30' height='2' fill='%23333844'/%3E%3Crect x='48' y='17' width='16' height='14' fill='%231f2229'/%3E%3C/svg%3E");
      background-size: 64px 32px;
      border: 6px solid #0f1115;
      box-shadow:
        0 0 0 4px #3f3f46,
        0 0 0 8px #0f1115,
        0 20px 50px rgba(0, 0, 0, 0.85),
        inset 0 0 30px rgba(0, 0, 0, 0.7);
      padding: 22px 18px;
      position: relative;
    }

    /* ====== 板内: 赛季条 + 总进度 ====== */
    .season-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      background-color: #1a1d24;
      box-shadow:
        0 -3px 0 0 #0b0c0e, 0 3px 0 0 #0b0c0e, -3px 0 0 0 #0b0c0e, 3px 0 0 0 #0b0c0e,
        inset 0 3px 0 0 #38bdf8, inset 0 -3px 0 0 #075985;
    }
    .season-strip .season-tag {
      font-family: var(--en-font);
      font-size: 8px;
      color: #38bdf8;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #0b0c0e;
    }
    .season-strip .season-name {
      font-family: var(--zh-font);
      font-size: 18px;
      color: #f8fafc;
      text-shadow: 2px 2px 0 #0b0c0e;
      letter-spacing: 1px;
    }
    .season-strip .season-dates {
      font-family: var(--num-font);
      font-size: 16px;
      color: #94a3b8;
    }

    .overall-progress { margin-bottom: 22px; }
    .overall-progress .op-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .overall-progress .op-label {
      font-family: var(--zh-font);
      font-size: 16px;
      color: #fde047;
      text-shadow: 2px 2px 0 #0b0c0e;
      letter-spacing: 1px;
    }
    .overall-progress .op-label .en {
      font-family: var(--en-font);
      font-size: 7px;
      color: #94a3b8;
      margin-left: 8px;
    }
    .overall-progress .op-num {
      font-family: var(--num-font);
      font-size: 22px;
      color: #4ade80;
      text-shadow: 2px 2px 0 #0b0c0e;
    }
    .pixel-progress-track {
      width: 100%;
      height: 14px;
      background-color: #121418;
      padding: 2px;
      box-shadow: inset 0 2px 0 0 #090a0c, 0 0 0 2px #475569;
      position: relative;
    }
    .pixel-progress-fill {
      height: 100%;
      transition: width 0.25s steps(8);
      position: relative;
      background: #facc15;
    }
    .pixel-progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.4);
    }

    /* ====== 分组标题 (像素横幅) ====== */
    .group-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 14px;
    }
    .group-banner .gb-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .group-banner h2 {
      margin: 0;
      font-family: var(--zh-font);
      font-size: 21px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #0b0c0e;
      color: #f8fafc;
    }
    .group-banner .gb-en {
      font-family: var(--en-font);
      font-size: 7px;
      color: #64748b;
      letter-spacing: 1px;
      margin-top: 6px;
      text-shadow: 1px 1px 0 #0b0c0e;
    }
    .group-banner .gb-line {
      flex: 1;
      height: 4px;
      background: repeating-linear-gradient(90deg, #334155 0 8px, transparent 8px 16px);
    }
    .group-banner .gb-count {
      font-family: var(--num-font);
      font-size: 18px;
      color: #94a3b8;
      text-shadow: 1px 1px 0 #0b0c0e;
    }

    /* ====== 成就卡片 (模板 pixel-card 同款骨架) ====== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 900px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .card-grid { grid-template-columns: 1fr; } }

    .pixel-card {
      background-color: #22252d;
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s steps(2);
      /* 默认灰主题 (未解锁) */
      --border-main: #475569;
      --border-dark: #1e293b;
      --glow-color: rgba(0, 0, 0, 0.4);
      --tier-color: #64748b;
    }
    .pixel-card:hover { transform: translateY(-2px); }
    .pixel-card:active { transform: translateY(1px); }

    .pixel-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        0 -4px 0 0 #0b0c0e, 0 4px 0 0 #0b0c0e, -4px 0 0 0 #0b0c0e, 4px 0 0 0 #0b0c0e,
        inset 0 4px 0 0 var(--border-main),
        inset 0 -4px 0 0 var(--border-dark),
        inset 4px 0 0 0 var(--border-main),
        inset -4px 0 0 0 var(--border-dark),
        0 0 18px var(--glow-color);
    }

    /* 档位主题色 */
    .tier-iron   { --border-main: #94a3b8; --border-dark: #475569; --glow-color: rgba(148,163,184,.30); --tier-color: #cbd5e1; }
    .tier-bronze { --border-main: #fb923c; --border-dark: #c2410c; --glow-color: rgba(251,146,60,.38); --tier-color: #fdba74; }
    .tier-silver { --border-main: #e2e8f0; --border-dark: #94a3b8; --glow-color: rgba(226,232,240,.42); --tier-color: #f1f5f9; }
    .tier-gold   { --border-main: #facc15; --border-dark: #ca8a04; --glow-color: rgba(250,204,21,.48); --tier-color: #fde047; }
    .tier-royal  { --border-main: #c084fc; --border-dark: #7e22ce; --glow-color: rgba(192,132,252,.55); --tier-color: #e9d5ff; }
    .tier-locked { --border-main: #334155; --border-dark: #1e293b; --glow-color: rgba(0,0,0,.4); --tier-color: #64748b; }

    .pixel-icon-slot {
      width: 66px;
      height: 66px;
      flex-shrink: 0;
      background-color: #16181e;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow:
        inset 0 3px 0 0 #0b0c0e, inset 0 -3px 0 0 #333844,
        inset 3px 0 0 0 #0b0c0e, inset -3px 0 0 0 #333844,
        0 0 0 3px var(--border-dark);
    }
    .pixel-icon-slot svg { width: 48px; height: 48px; }
    .tier-locked .pixel-icon-slot svg { filter: grayscale(1) brightness(.55); }
    .tier-locked .pixel-icon-slot { box-shadow:
        inset 0 3px 0 0 #0b0c0e, inset 0 -3px 0 0 #2d323e,
        inset 3px 0 0 0 #0b0c0e, inset -3px 0 0 0 #2d323e,
        0 0 0 3px #475569; }

    .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-name {
      font-family: var(--zh-font);
      font-size: 19px;
      letter-spacing: 1px;
      color: #f8fafc;
      text-shadow: 2px 2px 0 #0b0c0e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tier-locked .card-name { color: #94a3b8; }
    .card-count {
      font-family: var(--num-font);
      font-size: 20px;
      color: var(--tier-color);
      text-shadow: 2px 2px 0 #0b0c0e;
      flex-shrink: 0;
    }
    .card-status {
      font-family: var(--en-font);
      font-size: 7px;
      letter-spacing: 1px;
      margin-top: 5px;
      color: var(--tier-color);
      text-shadow: 2px 2px 0 #0b0c0e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 5 档 pip 行 */
    .tier-pips { display: flex; gap: 5px; margin-top: 7px; align-items: center; }
    .tier-pips .pip {
      width: 10px; height: 10px;
      box-shadow: 0 0 0 2px #0b0c0e;
      background: #1e293b;
    }
    .tier-pips .pip.reached.iron   { background: #94a3b8; }
    .tier-pips .pip.reached.bronze { background: #fb923c; }
    .tier-pips .pip.reached.silver { background: #e2e8f0; }
    .tier-pips .pip.reached.gold   { background: #facc15; }
    .tier-pips .pip.reached.royal  { background: #c084fc; }
    .tier-pips .pip.next { animation: pipBlink 0.9s steps(2) infinite; }
    @keyframes pipBlink { 50% { background: #64748b; } }

    .card .pixel-progress-track, .card-progress .pixel-progress-track { height: 12px; margin-top: 8px; }
    .card-progress .pixel-progress-fill { background: var(--tier-color); }
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-family: var(--num-font);
      font-size: 15px;
      color: #94a3b8;
      text-shadow: 1px 1px 0 #0b0c0e;
    }
    .progress-label .next-tier { color: var(--tier-color); }

    /* ====== 页脚 ====== */
    footer.site-foot {
      margin-top: 18px;
      text-align: center;
      padding: 0 12px;
    }
    footer.site-foot .foot-title {
      font-family: var(--en-font);
      font-size: 8px;
      color: #fde047;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #0b0c0e;
    }
    footer.site-foot .foot-sub {
      font-family: var(--zh-font);
      font-size: 14px;
      color: #a8a29e;
      margin-top: 6px;
      text-shadow: 1px 1px 0 #0b0c0e;
      letter-spacing: 1px;
    }

    .pixel-text-shadow { text-shadow: 2px 2px 0px #0b0c0e; }
  </style>
</head>
<body>

  <!-- ====== 顶部控制行 ====== -->
  <div class="top-bar">
    <div class="top-title">
      <span class="title-icon" id="title-icon" aria-hidden="true"></span>
      <div>
        <h1>像素成就墙</h1>
        <div class="title-sub">PIXEL ACHIEVEMENT WALL</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="token-chip" title="宠物代币 (星币) 余额">🌟 星币 <b id="pet-tokens">12</b></span>
      <button id="sound-toggle" class="pixel-btn" type="button">SFX: ON</button>
    </div>
  </div>

  <!-- ====== 地牢石砖成就板 ====== -->
  <main class="dungeon-board">
    <div class="season-strip">
      <span class="season-tag">SEASON 1</span>
      <span class="season-name">四年级上学期</span>
      <span class="season-dates">2026.09 — 2027.01</span>
    </div>

    <div class="overall-progress">
      <div class="op-head">
        <span class="op-label">🏆 成就解锁进度 <span class="en">UNLOCKED</span></span>
        <span class="op-num" id="overall-num">0 / 8</span>
      </div>
      <div class="pixel-progress-track">
        <div class="pixel-progress-fill" id="overall-fill" style="width: 0%"></div>
      </div>
    </div>

    <div id="wall-root"><!-- 分组由 JS 渲染 --></div>
  </main>

  <footer class="site-foot">
    <p class="foot-title">ACHIEVEMENT WALL · JAGER</p>
    <p class="foot-sub">每一次坚持，都会点亮一块像素 · 专心致志，收藏每一份荣誉</p>
  </footer>

  <script>
    // ==========================================
    // 1. 8-BIT 音效 (模板同款 Web Audio 方波)
    // ==========================================
    let audioCtx = null;
    let sfxEnabled = true;
    function playRetroSound(type) {
      if (!sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'step') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(587.33, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'unlock') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.07);
          osc.frequency.setValueAtTime(783.99, now + 0.14);
          osc.frequency.setValueAtTime(1046.50, now + 0.21);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        }
      } catch (err) { /* ignore */ }
    }
    document.getElementById('sound-toggle').addEventListener('click', (e) => {
      sfxEnabled = !sfxEnabled;
      e.target.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
      if (sfxEnabled) playRetroSound('step');
    });

    // ==========================================
    // 2. 16x16 像素图标 (模板同款画法, 每奖项一个专属图标)
    // ==========================================
    const PIXEL_ICONS = {
      bookOpen: `
        <svg viewBox="0 0 16 16">
          <path d="M2 4h5v7H2zM9 4h5v7H9z" fill="#bfdbfe"/>
          <path d="M3 5h3v5H3zM10 5h3v5h-3z" fill="#eff6ff"/>
          <path d="M7 4h2v8H7z" fill="#93c5fd"/>
          <path d="M1 11h14v2H1zM2 13h12v1H2z" fill="#1e40af"/>
          <path d="M1 11h14v1H1z" fill="#3b82f6"/>
          <path d="M11 2h2v3h-2z" fill="#ef4444"/>
        </svg>`,
      letterTile: `
        <svg viewBox="0 0 16 16">
          <path d="M2 2h12v12H2z" fill="#1e3a8a"/>
          <path d="M3 3h10v10H3z" fill="#3b82f6"/>
          <path d="M3 3h10v1H3zM3 3h1v10H3z" fill="#60a5fa"/>
          <path d="M12 3h1v10h-1zM3 12h10v1H3z" fill="#1e40af"/>
          <path d="M5 4h6v1H5zM5 7h4v1H5zM5 10h6v1H5zM5 4h1v7H5z" fill="#fde047"/>
        </svg>`,
      scrollStar: `
        <svg viewBox="0 0 16 16">
          <path d="M3 3h10v10H3z" fill="#fef9c3"/>
          <path d="M2 2h12v1H2zM2 13h12v1H2z" fill="#d4b106"/>
          <path d="M5 5h6v1H5zM5 7h6v1H5z" fill="#a16207"/>
          <path d="M9 9h4v4H9z" fill="#ef4444"/>
          <path d="M10 10h2v2h-2z" fill="#fca5a5"/>
        </svg>`,
      sun: `
        <svg viewBox="0 0 16 16">
          <path d="M5 5h6v6H5z" fill="#fbbf24"/>
          <path d="M6 6h4v4H6z" fill="#fde047"/>
          <path d="M7 7h2v2H7z" fill="#fef9c3"/>
          <path d="M7 1h2v2H7zM7 13h2v2H7zM1 7h2v2H1zM13 7h2v2h-2z" fill="#f59e0b"/>
          <path d="M3 2h2v2H3zM11 2h2v2h-2zM3 12h2v2H3zM11 12h2v2h-2z" fill="#fbbf24"/>
        </svg>`,
      broom: `
        <svg viewBox="0 0 16 16">
          <path d="M12 1h2v2h-2zM11 2h2v2h-2zM10 3h2v2h-2zM9 4h2v2H9zM8 5h2v2H8z" fill="#a16207"/>
          <path d="M12 1h1v1h-1zM11 2h1v1h-1zM10 3h1v1h-1zM9 4h1v1H9zM8 5h1v1H8z" fill="#d97706"/>
          <path d="M2 8h7v1H2z" fill="#facc15"/>
          <path d="M1 9h8v4H1z" fill="#d97706"/>
          <path d="M1 9h8v1H1z" fill="#f59e0b"/>
          <path d="M1 13h2v2H1zM4 13h2v2H4zM7 13h2v2H7z" fill="#b45309"/>
        </svg>`,
      bookStack: `
        <svg viewBox="0 0 16 16">
          <path d="M4 4h9v2H4z" fill="#ef4444"/>
          <path d="M4 4h9v1H4z" fill="#fca5a5"/>
          <path d="M13 4h1v2h-1z" fill="#fecaca"/>
          <path d="M3 7h10v2H3z" fill="#0d9488"/>
          <path d="M3 7h10v1H3z" fill="#2dd4bf"/>
          <path d="M12 7h1v2h-1z" fill="#99f6e4"/>
          <path d="M2 10h11v2H2z" fill="#7c3aed"/>
          <path d="M2 10h11v1H2z" fill="#a78bfa"/>
          <path d="M12 10h1v2h-1z" fill="#ddd6fe"/>
          <path d="M2 13h11v1H2z" fill="#4c1d95"/>
        </svg>`,
      musicNote: `
        <svg viewBox="0 0 16 16">
          <path d="M3 10h5v3H3z" fill="#7e22ce"/>
          <path d="M4 10h2v1H4z" fill="#d8b4fe"/>
          <path d="M8 2h2v9H8z" fill="#a855f7"/>
          <path d="M10 2h4v2h-4zM11 4h3v2h-3z" fill="#c084fc"/>
          <path d="M10 2h2v1h-2z" fill="#e9d5ff"/>
        </svg>`,
      gamepad: `
        <svg viewBox="0 0 16 16">
          <path d="M1 5h14v6H1z" fill="#475569"/>
          <path d="M1 5h14v1H1z" fill="#64748b"/>
          <path d="M1 10h14v1H1z" fill="#334155"/>
          <path d="M4 6h2v4H4zM3 7h4v2H3z" fill="#e2e8f0"/>
          <path d="M10 6h2v2h-2z" fill="#4ade80"/>
          <path d="M12 8h2v2h-2z" fill="#ef4444"/>
          <path d="M10 6h2v1h-2z" fill="#86efac"/>
        </svg>`,
      trophyTitle: `
        <svg viewBox="0 0 16 16">
          <path d="M4 2h8v2h1v3a5 5 0 0 1-4 4.9V14h3v1H4v-1h3v-2.1A5 5 0 0 1 3 7V4h1V2z" fill="#facc15"/>
          <path d="M4 3h8v4a4 4 0 0 1-8 0V3z" fill="#fde047"/>
          <path d="M6 5h1v3H6zM8 5h1v4H8z" fill="#fef9c3"/>
          <path d="M2 4h1v3H2zM13 4h1v3h-1z" fill="#ca8a04"/>
        </svg>`
    };

    // ==========================================
    // 3. 真实奖项数据 (8 奖项 × 5 档, 演示快照)
    //    ladder = 各档所需次数/天数 (spec §1-2)
    // ==========================================
    const TIER_ORDER = ['iron', 'bronze', 'silver', 'gold', 'royal'];
    const TIER_META = {
      iron:   { zh: '铁牌', en: 'IRON' },
      bronze: { zh: '铜牌', en: 'BRONZE' },
      silver: { zh: '银牌', en: 'SILVER' },
      gold:   { zh: '金牌', en: 'GOLD' },
      royal:  { zh: '王者', en: 'KING' },
    };

    const GROUPS = [
      { id: 'study', zh: '学习组', en: 'STUDY', icon: 'bookOpen' },
      { id: 'life',  zh: '生活组', en: 'LIFE',  icon: 'sun' },
      { id: 'skill', zh: '技能组', en: 'SKILL', icon: 'gamepad' },
    ];

    const AWARDS = [
      { id: 'chinese-dictation', grp: 'study', name: '语文默写全对', icon: 'bookOpen',    ladder: [1, 3, 5, 8, 10], count: 9, unit: '次' },
      { id: 'english-dictation', grp: 'study', name: '英语默写全对', icon: 'letterTile',  ladder: [1, 3, 5, 8, 10], count: 4, unit: '次' },
      { id: 'exam-excellent',    grp: 'study', name: '测评得优',     icon: 'scrollStar',  ladder: [1, 3, 5, 8, 10], count: 3, unit: '次' },
      { id: 'self-discipline',   grp: 'life',  name: '自律生活',     icon: 'sun',         ladder: [2, 4, 8, 15, 30], count: 3, unit: '天' },
      { id: 'creative-chore',    grp: 'life',  name: '创新家务奖',   icon: 'broom',       ladder: null,             count: 2, unit: '次' },
      { id: 'novel-reading',     grp: 'skill', name: '读完长篇小说', icon: 'bookStack',   ladder: [1, 3, 5, 8, 10], count: 1, unit: '本' },
      { id: 'music-piece',       grp: 'skill', name: '新曲子演奏',   icon: 'musicNote',   ladder: [1, 3, 5, 8, 10], count: 0, unit: '首' },
      { id: 'game-clear',        grp: 'skill', name: '通关新游戏',   icon: 'gamepad',     ladder: [1, 3, 5, 8, 10], count: 8, unit: '个' },
    ];

    // ==========================================
    // 4. 渲染逻辑
    // ==========================================
    function tierOf(award) {
      if (!award.ladder) return award.count > 0 ? 'silver' : 'locked';
      if (award.count <= 0) return 'locked';
      let t = 'iron';
      award.ladder.forEach((need, i) => { if (award.count >= need) t = TIER_ORDER[i]; });
      return t;
    }

    function nextGoal(award) {
      if (!award.ladder) return null;
      const idx = TIER_ORDER.indexOf(tierOf(award));
      if (idx < 0 || idx >= 4) return null; // 已王者
      return { tier: TIER_ORDER[idx + 1], need: award.ladder[idx + 1] };
    }

    function pipsHtml(award) {
      if (!award.ladder) return '';
      const cur = tierOf(award);
      const curIdx = TIER_ORDER.indexOf(cur);
      const next = nextGoal(award);
      return '<div class="tier-pips" aria-hidden="true">' + TIER_ORDER.map((t, i) => {
        const reached = curIdx >= 0 && i <= curIdx;
        const isNext = next && next.tier === t;
        return `<span class="pip${reached ? ' reached ' + t : ''}${isNext ? ' next' : ''}"></span>`;
      }).join('') + '</div>';
    }

    function cardHtml(award) {
      const tier = tierOf(award);
      const goal = nextGoal(award);
      let statusLine, pct, labelHtml;

      if (!award.ladder) {
        // 单发奖 (创新家务): 无档位, 展示累计次数
        statusLine = award.count > 0 ? `SPECIAL AWARD × ${award.count}` : 'NOT EARNED YET';
        pct = award.count > 0 ? 100 : 0;
        labelHtml = award.count > 0
          ? `<span>已获 ${award.count} ${award.unit}</span><span class="next-tier">★ 每次平发</span>`
          : `<span>尚未获得</span><span class="next-tier">等待点亮</span>`;
      } else if (tier === 'locked') {
        statusLine = 'LOCKED · 继续努力';
        pct = 0;
        labelHtml = `<span>${award.count} / ${award.ladder[0]} ${award.unit}</span><span class="next-tier">→ 铁牌 IRON</span>`;
      } else if (goal) {
        const curIdx = TIER_ORDER.indexOf(tier);
        const base = award.ladder[curIdx];
        pct = Math.max(6, Math.round(((award.count - base) / (goal.need - base)) * 100));
        statusLine = `UNLOCKED · ${TIER_META[tier].en} ${TIER_META[tier].zh}`;
        labelHtml = `<span>${award.count} / ${goal.need} ${award.unit}</span><span class="next-tier">→ ${TIER_META[goal.tier].zh} ${TIER_META[goal.tier].en}</span>`;
      } else {
        pct = 100;
        statusLine = `MAX UNLOCKED · KING 王者`;
        labelHtml = `<span>${award.count} ${award.unit}</span><span class="next-tier">★ 已达最高档</span>`;
      }

      return `
        <div class="pixel-card tier-${tier}" data-award="${award.id}">
          <div class="pixel-icon-slot">${PIXEL_ICONS[award.icon]}</div>
          <div class="card-info">
            <div class="card-top">
              <span class="card-name">${award.name}</span>
              ${award.count > 0 ? `<span class="card-count">×${award.count}</span>` : ''}
            </div>
            <div class="card-status">${statusLine}</div>
            ${pipsHtml(award)}
            <div class="card-progress">
              <div class="pixel-progress-track">
                <div class="pixel-progress-fill" style="width:${pct}%"></div>
              </div>
              <div class="progress-label">${labelHtml}</div>
            </div>
          </div>
        </div>`;
    }

    function render() {
      const root = document.getElementById('wall-root');
      root.innerHTML = GROUPS.map(g => {
        const items = AWARDS.filter(a => a.grp === g.id);
        const unlocked = items.filter(a => tierOf(a) !== 'locked').length;
        return `
          <div class="group-block">
            <div class="group-banner">
              <span class="gb-icon">${PIXEL_ICONS[g.icon]}</span>
              <h2>${g.zh}</h2>
              <span class="gb-en">${g.en}</span>
              <span class="gb-line"></span>
              <span class="gb-count">${unlocked}/${items.length}</span>
            </div>
            <div class="card-grid">${items.map(cardHtml).join('')}</div>
          </div>`;
      }).join('');

      // 总进度
      const unlockedAll = AWARDS.filter(a => tierOf(a) !== 'locked').length;
      document.getElementById('overall-num').textContent = `${unlockedAll} / ${AWARDS.length}`;
      document.getElementById('overall-fill').style.width = `${Math.round(unlockedAll / AWARDS.length * 100)}%`;
    }

    document.getElementById('title-icon').innerHTML = PIXEL_ICONS.trophyTitle;
    document.querySelectorAll('.gb-icon svg, .title-icon svg').forEach(s => {
      s.setAttribute('width', '100%'); s.setAttribute('height', '100%');
    });

    // 卡片点击 → 像素音效 (设计稿演示; 正式版接详情弹窗)
    document.getElementById('wall-root').addEventListener('click', (e) => {
      const card = e.target.closest('.pixel-card');
      if (card) playRetroSound('step');
    });

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
