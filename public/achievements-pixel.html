<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素成就墙 — JAGER</title>
  <!-- Retro Pixel Fonts: Press Start 2P (EN) + VT323 (数字) + ZCOOL QingKe HuangYou (中文方块像素风) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/achievements-pixel.css?v=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2323252d'/><path d='M4 2h8v2h1v3a5 5 0 0 1-4 4.9V14h3v1H4v-1h3v-2.1A5 5 0 0 1 3 7V4h1V2z' fill='%23facc15'/></svg>">
</head>
<body>

  <!-- ====== 顶部控制行 ====== -->
  <div class="top-bar">
    <div class="top-title">
      <span class="title-icon" id="title-icon" aria-hidden="true"></span>
      <div>
        <h1>像素成就墙</h1>
        <div class="title-sub">PIXEL ACHIEVEMENT WALL</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="token-chip" title="宠物代币 (星币) 余额">🌟 星币 <b id="pet-tokens">0</b></span>
      <button id="sound-toggle" class="pixel-btn" type="button">SFX: ON</button>
    </div>
  </div>

  <!-- ====== 地牢石砖成就板 ====== -->
  <main class="dungeon-board">
    <div class="season-strip">
      <span class="season-tag" id="season-tag">NO SEASON</span>
      <span class="season-name" id="season-name">尚未开启赛季</span>
      <span class="season-dates" id="season-dates">—</span>
    </div>

    <div class="overall-progress">
      <div class="op-head">
        <span class="op-label">🏆 成就解锁进度 <span class="en">UNLOCKED</span></span>
        <span class="op-num" id="overall-num">0 / 0</span>
      </div>
      <div class="pixel-progress-track">
        <div class="pixel-progress-fill" id="overall-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- ====== 加载中 ====== -->
    <div class="wall-state loading" id="state-loading">
      <div class="state-icon" id="state-loading-icon" aria-hidden="true"></div>
      <p class="state-text">正在点亮像素…</p>
      <p class="state-sub">LOADING THE PIXEL WALL</p>
    </div>

    <!-- ====== 出错 ====== -->
    <div class="wall-state error" id="state-error" hidden>
      <div class="state-icon" id="state-error-icon" aria-hidden="true"></div>
      <p class="state-text">像素墙暂时断电</p>
      <p class="state-sub" id="state-error-text">加载失败</p>
      <button id="btn-retry" class="pixel-btn" type="button">RETRY · 重试</button>
    </div>

    <!-- ====== 空数据 ====== -->
    <div class="wall-state empty" id="state-empty" hidden>
      <div class="state-icon" id="state-empty-icon" aria-hidden="true"></div>
      <p class="state-text">还没有成就记录</p>
      <p class="state-sub">NO ACHIEVEMENT RECORDS YET</p>
    </div>

    <!-- ====== 成就墙 (分组由 JS 渲染) ====== -->
    <div id="wall-root" hidden></div>
  </main>

  <footer class="site-foot">
    <p class="foot-title">ACHIEVEMENT WALL · JAGER</p>
    <p class="foot-sub">每一次坚持，都会点亮一块像素 · 专心致志，收藏每一份荣誉</p>
  </footer>

  <!-- 牌级规则的单一事实源 (classic script, 与 admin 面板共用) -->
  <script src="/shared/achievement-tiers.js?v=1"></script>
  <script src="/achievements-pixel.js?v=1"></script>
</body>
</html>
