<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFF9F0">
  <!-- Dev mode: prevent iPad Safari from caching stale HTML/JS across wrangler dev restarts. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>🔐 家长登录</title>
  <link rel="stylesheet" href="/app.css?v=4">
  <style>
    /* ====== Page-local layout for PM admin login ======
     * Reuses design tokens from /app.css (same warm palette, radii, shadows).
     * Scope: only classes prefixed with .login-* to avoid colliding with child UI. */
    .login-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .login-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .login-back {
      font-size: 15px;
      color: var(--text-soft);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      transition: background 0.2s var(--ease);
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .login-back:hover { background: var(--bg-soft); }
    .login-title {
      text-align: center;
      margin: 16px 0 4px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .login-sub {
      text-align: center;
      margin: 0 0 28px;
      color: var(--text-soft);
      font-size: 15px;
    }

    /* PIN dots (4 visible, up to 8 supported) */
    .login-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 8px 0 28px;
    }
    .login-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--border-med);
      transition: background 0.15s var(--ease), transform 0.2s var(--bounce),
                  border-color 0.15s var(--ease);
    }
    .login-dot.filled {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
    }
    .login-dot.error {
      background: #EF4444;
      border-color: #EF4444;
      animation: login-shake 0.4s var(--ease);
    }
    @keyframes login-shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* 3×4 number pad (4 rows × 3 cols) */
    .login-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
    }
    .login-key {
      min-height: 72px;
      border: 0;
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: var(--shadow-sm);
      font-size: 28px;
      font-weight: 700;
      color: var(--text-strong);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s var(--bounce), box-shadow 0.2s var(--ease),
                  background 0.2s var(--ease);
      -webkit-user-select: none;
      user-select: none;
    }
    .login-key:hover { background: var(--bg-soft); }
    .login-key:active { transform: scale(0.92); }
    .login-key:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .login-key.back { background: var(--bg-soft); font-size: 22px; }
    .login-key.submit {
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-dark));
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(255, 138, 76, 0.3);
    }
    .login-key.submit:hover { box-shadow: 0 8px 20px rgba(255, 138, 76, 0.45); }
    .login-key.submit:disabled {
      background: var(--border-med);
      box-shadow: none;
      color: var(--text-muted);
    }

    .login-locked {
      text-align: center;
      margin: 16px auto 0;
      max-width: 360px;
      padding: 14px 16px;
      background: #FEE2E2;
      color: #991B1B;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
    }
    .login-locked[hidden] { display: none; }
    .login-locked strong { color: #B91C1C; }

    @media (min-width: 768px) {
      .login-title { font-size: 32px; }
      .login-pad { max-width: 420px; gap: 14px; }
      .login-key { min-height: 80px; font-size: 32px; }
    }
  </style>
</head>
<body>
  <!-- ====== Error banner (network/server errors) ====== -->
  <div id="error-banner" class="error-banner" hidden>
    <span id="error-banner-text">出错了</span>
    <button id="error-banner-retry" class="error-banner-retry">重试</button>
  </div>

  <main class="login-wrap">
    <div class="login-top">
      <a href="/" class="login-back" aria-label="返回孩子界面">← 孩子界面</a>
      <span></span>
    </div>

    <h1 class="login-title">🔐 家长登录</h1>
    <p class="login-sub">输入 4-8 位 PIN 访问管理后台</p>

    <!-- 8 dots; only first 4 are "active" in default UX, but up to 8 supported -->
    <div id="login-dots" class="login-dots" aria-label="PIN 输入" role="group">
      <span class="login-dot"></span>
      <span class="login-dot"></span>
      <span class="login-dot"></span>
      <span class="login-dot"></span>
      <span class="login-dot" data-extra></span>
      <span class="login-dot" data-extra></span>
      <span class="login-dot" data-extra></span>
      <span class="login-dot" data-extra></span>
    </div>

    <!-- Number pad -->
    <div id="login-pad" class="login-pad" role="group" aria-label="数字键盘">
      <button class="login-key" data-digit="1" aria-label="1">1</button>
      <button class="login-key" data-digit="2" aria-label="2">2</button>
      <button class="login-key" data-digit="3" aria-label="3">3</button>
      <button class="login-key" data-digit="4" aria-label="4">4</button>
      <button class="login-key" data-digit="5" aria-label="5">5</button>
      <button class="login-key" data-digit="6" aria-label="6">6</button>
      <button class="login-key" data-digit="7" aria-label="7">7</button>
      <button class="login-key" data-digit="8" aria-label="8">8</button>
      <button class="login-key" data-digit="9" aria-label="9">9</button>
      <button id="login-back" class="login-key back" type="button" aria-label="删除一位">⌫</button>
      <button class="login-key" data-digit="0" aria-label="0">0</button>
      <button id="login-submit" class="login-key submit" type="button" aria-label="提交" disabled>✓</button>
    </div>

    <!-- Lockout banner -->
    <div id="login-locked" class="login-locked" hidden role="alert">
      <strong>已锁定</strong><br>
      尝试次数过多，请 5 分钟后再试。
    </div>
  </main>

  <!-- Toast (reuses .toast from app.css) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/admin/login.js" defer></script>
</body>
</html>
