<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07090D">
  <!-- Dev mode: prevent iPad Safari from caching stale HTML/JS across wrangler dev restarts. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>🔐 家长登录</title>
  <link rel="stylesheet" href="/app.css?v=6">
</head>
<body>
  <!-- ====== Error banner (network/server errors) ====== -->
  <div id="error-banner" class="error-banner" hidden>
    <span id="error-banner-text">出错了</span>
    <button id="error-banner-retry" class="error-banner-retry">重试</button>
  </div>

  <main class="login-wrap">
    <div class="login-top">
      <a href="/" class="login-back" aria-label="返回孩子界面">← 孩子界面</a>
      <span></span>
    </div>

    <h1 class="login-title">🔐 家长登录</h1>
    <p class="login-sub">输入 4-8 位 PIN 访问管理后台</p>

    <!-- 8 dots; only first 4 are "active" in default UX, but up to 8 supported -->
    <div id="login-dots" class="login-dots" aria-label="PIN 输入" role="group">
      <span class="login-dot"></span>
      <span class="login-dot"></span>
      <span class="login-dot"></span>
      <span class="login-dot"></span>
      <span class="login-dot" data-extra></span>
      <span class="login-dot" data-extra></span>
      <span class="login-dot" data-extra></span>
      <span class="login-dot" data-extra></span>
    </div>

    <!-- Number pad -->
    <div id="login-pad" class="login-pad" role="group" aria-label="数字键盘">
      <button class="login-key" data-digit="1" aria-label="1">1</button>
      <button class="login-key" data-digit="2" aria-label="2">2</button>
      <button class="login-key" data-digit="3" aria-label="3">3</button>
      <button class="login-key" data-digit="4" aria-label="4">4</button>
      <button class="login-key" data-digit="5" aria-label="5">5</button>
      <button class="login-key" data-digit="6" aria-label="6">6</button>
      <button class="login-key" data-digit="7" aria-label="7">7</button>
      <button class="login-key" data-digit="8" aria-label="8">8</button>
      <button class="login-key" data-digit="9" aria-label="9">9</button>
      <button id="login-back" class="login-key back" type="button" aria-label="删除一位">⌫</button>
      <button class="login-key" data-digit="0" aria-label="0">0</button>
      <button id="login-submit" class="login-key submit" type="button" aria-label="提交" disabled>✓</button>
    </div>

    <!-- Lockout banner -->
    <div id="login-locked" class="login-locked" hidden role="alert">
      <strong>已锁定</strong><br>
      尝试次数过多，请 5 分钟后再试。
    </div>
  </main>

  <!-- Toast (reuses .toast from app.css) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/admin/login.js" defer></script>
</body>
</html>
